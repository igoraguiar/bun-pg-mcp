name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Compile standalone binary
        run: bun run compile

      - name: Prepare release asset
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p release
          cp out/pg-mcp "release/pg-mcp${VERSION}-linux-x64"
          # Optional compression
          tar -czf "release/pg-mcp${VERSION}-linux-x64.tar.gz" -C release "pg-mcp${VERSION}-linux-x64"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
